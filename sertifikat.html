    <script>
        // MODAL
        const modal = new bootstrap.Modal(document.getElementById('sertifikatModal'));
        document.querySelectorAll('.sertifikat-card').forEach(card => {
            card.addEventListener('click', () => {
                const title = card.dataset.title;
                document.getElementById('modalTitle').innerText = title;
                const imgEl = document.getElementById('modalImg');
                imgEl.src = card.dataset.img;
                imgEl.alt = title + ' – Mohammad Ahsan Al Ghoni';
                modal.show();
                anime({
                    targets: '#modalImg',
                    opacity: [0, 1],
                    scale: [0.95, 1],
                    duration: 350,
                    easing: 'easeOutQuad'
                });
            });
        });

        // FILTER
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.dataset.filter;
                document.querySelectorAll('.sertifikat-item').forEach(item => {
                    item.style.display = (filter === 'all' || item.classList.contains(filter)) ? 'block' : 'none';
                });
            });
        });

        // ANIMASI MASUK
        anime({
            targets: '.sertifikat-item',
            opacity: [0, 1],
            translateY: [25, 0],
            delay: anime.stagger(70),
            easing: 'easeOutExpo'
